<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paystack MoMo Checkout</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f9fafb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .checkout-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .amount-display {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
            margin: 8px 0;
        }
        .label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .phone-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .phone-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .pay-button {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .pay-button:hover {
            background-color: #2563eb;
        }
        .pay-button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        .network-indicator {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>

<div class="checkout-card">
    <div class="header">
        <span style="color: #6b7280; font-size: 14px; font-weight: 500;">Payment Amount</span>
        <div class="amount-display">GH₵ 50.00</div>
    </div>

    <form id="paymentForm" onsubmit="processPayment(event)">
        <div class="input-group">
            <label class="label" for="email">Email Address</label>
            <input type="email" id="email" class="phone-input" placeholder="customer@email.com" required>
        </div>

        <div class="input-group">
            <label class="label" for="phone">Mobile Money Number</label>
            <input type="tel" id="phone" class="phone-input" placeholder="e.g. 0241234567" maxlength="10" pattern="[0-9]{10}" required oninput="detectNetwork()">
            <span id="networkText" class="network-indicator"></span>
        </div>

        <button type="submit" id="submitBtn" class="pay-button">Pay GH₵ 50.00</button>
    </form>
</div>

<!-- Paystack Inline Script -->
<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
    // Simple helper to guess Ghana telecom network prefixes
    function detectNetwork() {
        const phone = document.getElementById('phone').value;
        const textElement = document.getElementById('networkText');
        
        if (phone.length >= 3) {
            const prefix = phone.substring(0, 3);
            if (['024', '054', '055', '059', '025', '053'].includes(prefix)) {
                textElement.innerText = "Detected: MTN Mobile Money";
            } else if (['020', '050'].includes(prefix)) {
                textElement.innerText = "Detected: Telecel Cash (Vodafone)";
            } else if (['026', '027', '057', '056'].includes(prefix)) {
                textElement.innerText = "Detected: AT Money (AirtelTigo)";
            } else {
                textElement.innerText = "";
            }
        } else {
            textElement.innerText = "";
        }
    }

    function processPayment(event) {
        event.preventDefault();
        
        const customerEmail = document.getElementById('email').value;
        const btn = document.getElementById('submitBtn');
        
        btn.disabled = true;
        btn.innerText = "Initializing Checkout...";

        let handler = PaystackPop.setup({
            key: 'pk_test_2d73ef8f61763323f47dc380fd143106037817a1', // Use your public test key (starts with pk_test_)
            email: customerEmail,
            amount: 5000, // 50 GHS translated to 5000 Pesewas
            currency: 'GHS',
            channels: ['mobile_money'], // Bypasses card options entirely to focus on MoMo
            ref: 'momo_50ghs_' + Math.floor((Math.random() * 100000000) + 1),
            
            onClose: function() {
                alert('Payment canceled by user.');
                btn.disabled = false;
                btn.innerText = "Pay GH₵ 50.00";
            },
            callback: function(response) {
                alert('Authorization checklist sent! Paystack Ref: ' + response.reference);
                // Optional: Send response.reference to your backend verification route here
                btn.disabled = false;
                btn.innerText = "Pay GH₵ 50.00";
            }
        });
        
        handler.openIframe();
    }
</script>

</body>
</html>
