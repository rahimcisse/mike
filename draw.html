    <script>
        const pageKey = 'draw';
        const cardsRoot = document.getElementById('program-cards');

        async function renderPage() {
            const programData = await refreshProgramsData(pageKey);
            console.debug('[draw.html] programData:', programData, 'cards:', (programData && programData.cards) ? programData.cards.length : 0);
            if (cardsRoot) {
                const titleElement = document.querySelector('.section-title h2');
                if (titleElement) {
                    titleElement.textContent = programData.title || "TODAY'S DRAW GAMES";
                }

                cardsRoot.innerHTML = (programData.cards || []).map((card) => {
                    const items = (card.entries || []).map((entry) => `<li>${entry}</li>`).join('');
                    const icon = card.icon || 'ph ph-soccer-ball';
                    const code = card.code || '000000';

                    return `
                        <div class="card hidden">
                            <div class="card-icon"><i class="${icon}"></i></div>
                            <h3>${card.title || 'Program Card'}</h3>
                            <ul>${items}</ul>
                            <a onclick="myFunction('${code}')" class="btn" style="margin-top: 15px; width: 100%; text-align: center;">COPY BOOKING CODE</a>
                        </div>
                    `;
                }).join('');

                // Observe hidden cards for scroll reveal
                try {
                    const hiddenCards = document.querySelectorAll('.card.hidden');
                    hiddenCards.forEach((el) => observer.observe(el));
                } catch (e) {}
                // Force show newly-rendered cards immediately (safety fallback)
                try {
                    const created = cardsRoot.querySelectorAll('.card');
                    created.forEach((c) => c.classList.add('show'));
                } catch (e) {}
            }

        }

        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');
        const navItems = document.querySelectorAll('.nav-links a');

        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                const icon = hamburger.querySelector('i');
                if (navLinks.classList.contains('active')) {
                    icon.classList.remove('ph-list');
                    icon.classList.add('ph-x');
                } else {
                    icon.classList.remove('ph-x');
                    icon.classList.add('ph-list');
                }
            });
        }

        navItems.forEach((item) => {
            item.addEventListener('click', () => {
                if (navLinks && navLinks.classList.contains('active')) {
                    navLinks.classList.remove('active');
                    const icon = hamburger.querySelector('i');
                    icon.classList.remove('ph-x');
                    icon.classList.add('ph-list');
                }
            });
        });

        const observerOptions = { threshold: 0.1 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show');
                }
            });
        }, observerOptions);

        renderPage();

        function myFunction(code) {
            const text = String(code);

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('Copied the text: ' + text);
                }).catch(() => {
                    fallbackCopy(text);
                });
                return;
            }

            fallbackCopy(text);
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    alert('Booking Code Copied : ' + text);
                } else {
                    alert('Unable to copy. Please select and copy manually.');
                }
            } catch (err) {
                alert('Copy failed: ' + err);
            }

            document.body.removeChild(textarea);
        }
    </script>
