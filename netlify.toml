[build]
  publish = "."
  command = "echo 'No build step needed - static site'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Production environment variables (set these in Netlify UI or uncomment and fill here)
[context.production.environment]
#  FIREBASE_API_KEY = "your_api_key_here"
#  FIREBASE_AUTH_DOMAIN = "your_project.firebaseapp.com"
#  FIREBASE_PROJECT_ID = "your_project_id"
#  FIREBASE_STORAGE_BUCKET = "your_project.appspot.com"
#  FIREBASE_MESSAGING_SENDER_ID = "..."
#  FIREBASE_APP_ID = "..."

## Content Security Policy
## NOTE: Allowing 'unsafe-eval' weakens CSP. Prefer removing eval-usage or hosting non-eval builds.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://firestore.googleapis.com https://*.googleapis.com wss:; font-src 'self' https://fonts.gstatic.com data:;"
